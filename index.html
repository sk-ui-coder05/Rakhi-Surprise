<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Raksha Bandhan | Here's Your Gift</title>
    <meta name="description" content="Happy Raksha Bandhan - Here is your special surprise gift!">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Audio Control Button in Top Right -->
    <div class="audio-control-wrapper">
        <button class="audio-btn" id="audio-btn" aria-label="Toggle Background Music">
            <span class="music-icon" id="music-icon">🎵</span>
            <span class="audio-label" id="audio-label">Music Off</span>
            <span class="audio-dots">...</span>
        </button>
    </div>
    
    <audio id="bg-music" loop preload="auto">
        <source src="Rakhi_Song.mp3" type="audio/mpeg">
    </audio>

    <!-- Background Ambient Floral Geometric Outlines & Sparkles -->
    <div class="bg-artistic-layer">
        <!-- Floating Floral Stars (Geometric Wireframes matching screenshot) -->
        <svg class="bg-star-wireframe star-top-left" viewBox="0 0 100 100" fill="none" stroke="#d6ccc2" stroke-width="1.2">
            <path d="M50 5 L53 38 L85 15 L62 47 L95 50 L62 53 L85 85 L53 62 L50 95 L47 62 L15 85 L38 53 L5 50 L38 47 L15 15 L47 38 Z"/>
            <circle cx="50" cy="50" r="18" stroke="#e0d6cc" stroke-width="1"/>
        </svg>

        <svg class="bg-star-wireframe star-bottom-left" viewBox="0 0 100 100" fill="none" stroke="#ded5cb" stroke-width="1.2">
            <path d="M50 5 L53 38 L85 15 L62 47 L95 50 L62 53 L85 85 L53 62 L50 95 L47 62 L15 85 L38 53 L5 50 L38 47 L15 15 L47 38 Z"/>
            <circle cx="50" cy="50" r="16" stroke="#e6ded6" stroke-width="1"/>
        </svg>

        <svg class="bg-star-wireframe star-top-right" viewBox="0 0 100 100" fill="none" stroke="#ded5cb" stroke-width="1">
            <path d="M50 15 L52 40 L75 25 L60 48 L85 50 L60 52 L75 75 L52 60 L50 85 L48 60 L25 75 L40 52 L15 50 L40 48 L25 25 L48 40 Z"/>
        </svg>
    </div>

    <!-- Canvas for subtle background sparkle dots -->
    <canvas id="sparkle-canvas"></canvas>

    <!-- Main Centered Landing Card -->
    <main class="main-viewport-container">
        <div class="rakhi-main-card">
            
            <!-- Left Column: High-Res Raksha Bandhan Illustration -->
            <div class="card-left-column">
                <div class="illustration-wrapper">
                    <img src="rakhi_illustration.png" alt="Happy Raksha Bandhan Illustration" class="rakhi-illustration-img">
                </div>
            </div>

            <!-- Right Column: Typographic Header, Gift Tagline & 3D Gift Box CTA -->
            <div class="card-right-column">
                
                <!-- Exact Typographic Layout -->
                <div class="raksha-title-wrap">
                    <span class="sub-happy">H A P P Y</span>
                    <h1 class="script-raksha">Raksha</h1>
                    <span class="sub-bandhan">B A N D H A N</span>
                </div>

                <!-- Gift Callout -->
                <div class="gift-callout-section">
                    <h2 class="gift-tagline">Here's your gift 🎁</h2>
                    <p class="gift-subtext">Click the surprise gift box below to unwrap!</p>
                </div>

                <!-- 3D Interactive Gift Box CTA -->
                <div class="gift-box-area">
                    <div class="gift-box-wrapper" id="gift-box-wrapper" role="button" tabindex="0" aria-label="Open Raksha Bandhan Surprise Gift Box">
                        <div class="gift-box" id="gift-box">
                            <!-- Golden Lid with Yellow Bow -->
                            <div class="gift-lid" id="gift-lid">
                                <div class="lid-top"></div>
                                <div class="lid-ribbon-v"></div>
                                <!-- Bow -->
                                <div class="gift-bow">
                                    <div class="bow-loop bow-left"></div>
                                    <div class="bow-loop bow-right"></div>
                                    <div class="bow-center"></div>
                                    <div class="bow-tail tail-left"></div>
                                    <div class="bow-tail tail-right"></div>
                                </div>
                            </div>

                            <!-- Deep Teal Box Body with Golden Ribbon Cross -->
                            <div class="gift-body">
                                <div class="body-ribbon-v"></div>
                                <div class="body-ribbon-h"></div>
                                <div class="inner-glow"></div>
                            </div>

                            <!-- Soft Ground Shadow -->
                            <div class="box-shadow"></div>
                        </div>
                    </div>
                </div>

            </div>

        </div>

        <!-- Revealed Surprise Card Modal (Emerges when Gift Box is unwrapped) -->
        <div class="surprise-card-container" id="surprise-card-container">
            <div class="surprise-card" id="surprise-card">
                <button class="card-close-x" id="close-card-btn" aria-label="Close card">&times;</button>
                <div class="card-border-light"></div>

                <div class="card-rakhi-badge">
                    <span class="gift-emoji">🎁</span>
                </div>

                <h2 class="card-headline">Surprise Revealed! 🎉</h2>
                <p class="card-submessage">Wishing you endless happiness, laughter, and sweet surprises on this beautiful occasion of Raksha Bandhan.</p>

                <!-- Featured URL Card -->
                <div class="url-destination-box">
                    <span class="url-badge-label">Your Exclusive Destination</span>
                    <div class="url-display-text" id="target-url">www.theprettyarts.com</div>
                    
                    <div class="action-buttons-group">
                        <a href="https://www.theprettyarts.com" target="_blank" rel="noopener noreferrer" class="btn btn-teal-solid">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                            Visit Website
                        </a>
                        <button class="btn btn-gold-outline" id="copy-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            <span id="copy-text">Copy Link</span>
                        </button>
                    </div>
                </div>

                <button class="btn-wrap-again" id="replay-btn">
                    <span>🔄 Wrap Box Again</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
