<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Raksha Bandhan | Here's Your Gift</title>
    <meta name="description" content="Happy Raksha Bandhan - Here is your special surprise gift!">
    
    <!-- Google Fonts: Great Vibes for 'Raksha', Montserrat & Outfit for modern clean typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Audio Control Button & Background Audio -->
    <div class="audio-control-wrapper">
        <button class="audio-btn" id="audio-btn" aria-label="Toggle Background Music">
            <span class="music-icon" id="music-icon">🎵</span>
            <span class="audio-label" id="audio-label">Music Playing</span>
            <div class="sound-wave" id="sound-wave">
                <span class="bar bar-1"></span>
                <span class="bar bar-2"></span>
                <span class="bar bar-3"></span>
            </div>
        </button>
    </div>
    
    <audio id="bg-music" loop preload="auto">
        <source src="Rakhi_Song.mp3" type="audio/mpeg">
    </audio>

    <!-- Ambient Watercolor & Floral Background Elements -->
    <div class="bg-artistic-layer">
        <div class="watercolor-splash splash-left"></div>
        <div class="watercolor-splash splash-center"></div>
        
        <!-- Floral Mandala Ornaments -->
        <svg class="mandala-art mandala-1" viewBox="0 0 100 100" fill="none" stroke="currentColor">
            <circle cx="50" cy="50" r="18" stroke-width="1.2" opacity="0.35"/>
            <g opacity="0.3" stroke-width="1.2">
                <path d="M50 20 C45 32 45 38 50 50 C55 38 55 32 50 20 Z"/>
                <path d="M50 80 C45 68 45 62 50 50 C55 68 55 62 50 80 Z"/>
                <path d="M20 50 C32 45 38 45 50 50 C38 55 32 55 20 50 Z"/>
                <path d="M80 50 C68 45 62 45 50 50 C68 55 62 55 80 50 Z"/>
                <path d="M29 29 C38 35 42 41 50 50 C41 42 35 38 29 29 Z"/>
                <path d="M71 71 C62 65 58 59 50 50 C59 58 65 62 71 71 Z"/>
                <path d="M29 71 C38 65 42 59 50 50 C41 58 35 62 29 71 Z"/>
                <path d="M71 29 C62 35 58 41 50 50 C59 42 65 38 71 29 Z"/>
            </g>
        </svg>

        <svg class="mandala-art mandala-2" viewBox="0 0 100 100" fill="none" stroke="currentColor">
            <circle cx="50" cy="50" r="22" stroke-width="1" opacity="0.3"/>
            <g opacity="0.25" stroke-width="1.2">
                <path d="M50 15 C44 30 44 38 50 50 C56 38 56 30 50 15 Z"/>
                <path d="M50 85 C44 70 44 62 50 50 C56 62 56 70 50 85 Z"/>
                <path d="M15 50 C30 44 38 44 50 50 C38 56 30 56 15 50 Z"/>
                <path d="M85 50 C70 44 62 44 50 50 C62 56 70 56 85 50 Z"/>
            </g>
        </svg>

        <svg class="mandala-art mandala-3" viewBox="0 0 100 100" fill="none" stroke="currentColor">
            <circle cx="50" cy="50" r="16" stroke-width="1.2" opacity="0.25"/>
            <g opacity="0.25" stroke-width="1">
                <path d="M50 22 C46 34 46 40 50 50 C54 40 54 34 50 22 Z"/>
                <path d="M50 78 C46 66 46 60 50 50 C54 60 54 66 50 78 Z"/>
                <path d="M22 50 C34 46 40 46 50 50 C40 54 34 54 22 50 Z"/>
                <path d="M78 50 C66 46 60 46 50 50 C60 54 66 54 78 50 Z"/>
            </g>
        </svg>
    </div>

    <!-- Soft Golden Sparkles Canvas -->
    <canvas id="sparkle-canvas"></canvas>

    <!-- Main Landing Container -->
    <main class="landing-card-wrapper">
        <div class="banner-layout">
            
            <!-- Left Side: Iconic Rakhi Illustration matching the provided theme -->
            <div class="rakhi-showcase">
                <!-- Diagonal Thread -->
                <div class="rakhi-thread-line"></div>
                
                <!-- Detailed Rakhi Emblem -->
                <div class="rakhi-emblem-container">
                    <svg class="theme-rakhi-svg" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Gold Diamond Points Gradient -->
                            <linearGradient id="facetGold" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#FFF099"/>
                                <stop offset="50%" stop-color="#F2B705"/>
                                <stop offset="100%" stop-color="#D48B00"/>
                            </linearGradient>

                            <!-- Outer Blue Ring Gradient -->
                            <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#0e6884"/>
                                <stop offset="100%" stop-color="#083848"/>
                            </linearGradient>

                            <!-- Red Bead Ring Gradient -->
                            <radialGradient id="redRingGrad" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#D92534"/>
                                <stop offset="100%" stop-color="#8C0D19"/>
                            </radialGradient>

                            <!-- Central Golden Dome Gradient -->
                            <radialGradient id="centerDome" cx="35%" cy="35%" r="65%">
                                <stop offset="0%" stop-color="#FFF6D1"/>
                                <stop offset="25%" stop-color="#FFD43F"/>
                                <stop offset="65%" stop-color="#E59800"/>
                                <stop offset="100%" stop-color="#9C5B00"/>
                            </radialGradient>

                            <filter id="shadowRakhi" x="-20%" y="-20%" width="140%" height="140%">
                                <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
                            </filter>
                        </defs>

                        <!-- Outer Faceted Golden Sunburst Rays (16 Points) -->
                        <g filter="url(#shadowRakhi)">
                            <!-- Facet Triangles -->
                            <g id="sunburst-rays">
                                <!-- Generated 16 Ray points -->
                                <polygon points="120,12 127,38 113,38" fill="url(#facetGold)"/>
                                <polygon points="161,28 157,53 145,46" fill="url(#facetGold)"/>
                                <polygon points="196,63 180,82 173,71" fill="url(#facetGold)"/>
                                <polygon points="212,104 187,113 185,99" fill="url(#facetGold)"/>
                                <polygon points="228,120 202,127 202,113" fill="url(#facetGold)"/>
                                <polygon points="212,136 185,141 187,127" fill="url(#facetGold)"/>
                                <polygon points="196,177 173,169 180,158" fill="url(#facetGold)"/>
                                <polygon points="161,212 145,194 157,187" fill="url(#facetGold)"/>
                                <polygon points="120,228 113,202 127,202" fill="url(#facetGold)"/>
                                <polygon points="79,212 83,187 95,194" fill="url(#facetGold)"/>
                                <polygon points="44,177 60,158 67,169" fill="url(#facetGold)"/>
                                <polygon points="28,136 53,127 55,141" fill="url(#facetGold)"/>
                                <polygon points="12,120 38,113 38,127" fill="url(#facetGold)"/>
                                <polygon points="28,104 55,99 53,113" fill="url(#facetGold)"/>
                                <polygon points="44,63 67,71 60,82" fill="url(#facetGold)"/>
                                <polygon points="79,28 95,46 83,53" fill="url(#facetGold)"/>
                            </g>
                        </g>

                        <!-- Outer Golden Ring -->
                        <circle cx="120" cy="120" r="76" fill="#F4C01E" stroke="#D18F04" stroke-width="2"/>

                        <!-- Teal Decorative Ring -->
                        <circle cx="120" cy="120" r="70" fill="url(#tealGrad)"/>

                        <!-- Gold Bead Pearls around Teal Ring -->
                        <g fill="#FFF0A3" stroke="#D99700" stroke-width="0.8">
                            <circle cx="120" cy="56" r="3.5"/>
                            <circle cx="145" cy="61" r="3.5"/>
                            <circle cx="166" cy="74" r="3.5"/>
                            <circle cx="179" cy="95" r="3.5"/>
                            <circle cx="184" cy="120" r="3.5"/>
                            <circle cx="179" cy="145" r="3.5"/>
                            <circle cx="166" cy="166" r="3.5"/>
                            <circle cx="145" cy="179" r="3.5"/>
                            <circle cx="120" cy="184" r="3.5"/>
                            <circle cx="95" cy="179" r="3.5"/>
                            <circle cx="74" cy="166" r="3.5"/>
                            <circle cx="61" cy="145" r="3.5"/>
                            <circle cx="56" cy="120" r="3.5"/>
                            <circle cx="61" cy="95" r="3.5"/>
                            <circle cx="74" cy="74" r="3.5"/>
                            <circle cx="95" cy="61" r="3.5"/>
                        </g>

                        <!-- Inner Gold Border -->
                        <circle cx="120" cy="120" r="48" fill="#F8CA2A" stroke="#C57E00" stroke-width="1.5"/>

                        <!-- Crimson / Red Patterned Center Base -->
                        <circle cx="120" cy="120" r="43" fill="url(#redRingGrad)"/>

                        <!-- Small Golden Dots in Red Ring -->
                        <g fill="#FFE685">
                            <circle cx="120" cy="85" r="2"/>
                            <circle cx="138" cy="89" r="2"/>
                            <circle cx="151" cy="102" r="2"/>
                            <circle cx="155" cy="120" r="2"/>
                            <circle cx="151" cy="138" r="2"/>
                            <circle cx="138" cy="151" r="2"/>
                            <circle cx="120" cy="155" r="2"/>
                            <circle cx="102" cy="151" r="2"/>
                            <circle cx="89" cy="138" r="2"/>
                            <circle cx="85" cy="120" r="2"/>
                            <circle cx="89" cy="102" r="2"/>
                            <circle cx="102" cy="89" r="2"/>
                        </g>

                        <!-- Sibling Photo Embedded Inside the Center Rakhi Medallion -->
                        <clipPath id="rakhiPhotoClip">
                            <circle cx="120" cy="120" r="35"/>
                        </clipPath>

                        <!-- Golden Bezel Ring -->
                        <circle cx="120" cy="120" r="37" fill="#F8DF72" stroke="#C57E00" stroke-width="2"/>
                        
                        <!-- Photo -->
                        <image href="memory_photo.jpg" x="70" y="70" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#rakhiPhotoClip)"/>
                        
                        <!-- Outer Golden Accent Rim over Photo -->
                        <circle cx="120" cy="120" r="35" fill="none" stroke="url(#facetGold)" stroke-width="2.5" opacity="0.95"/>
                    </svg>
                </div>
            </div>

            <!-- Right Side: Heading & Interactive Surprise Gift CTA -->
            <div class="content-showcase">
                <!-- Exact Typographic Layout Matching Image -->
                <div class="raksha-title-wrap">
                    <span class="sub-happy">HAPPY</span>
                    <h1 class="script-raksha">Raksha</h1>
                    <span class="sub-bandhan">BANDHAN</span>
                </div>

                <!-- Custom Gift Section -->
                <div class="gift-invitation">
                    <p class="gift-tagline">Here's your gift 🎁</p>
                    <span class="gift-subtext">Click the surprise gift box below to unwrap!</span>
                </div>

                <!-- Interactive 3D Gift Box -->
                <div class="gift-box-area">
                    <div class="gift-box-wrapper" id="gift-box-wrapper" role="button" tabindex="0" aria-label="Open Raksha Bandhan Surprise Gift Box">
                        <div class="gift-box" id="gift-box">
                            <!-- Lid with Bow -->
                            <div class="gift-lid" id="gift-lid">
                                <div class="lid-top"></div>
                                <div class="lid-ribbon-v"></div>
                                <div class="lid-ribbon-h"></div>
                                <!-- Bow -->
                                <div class="gift-bow">
                                    <div class="bow-loop bow-left"></div>
                                    <div class="bow-loop bow-right"></div>
                                    <div class="bow-center"></div>
                                    <div class="bow-tail tail-left"></div>
                                    <div class="bow-tail tail-right"></div>
                                </div>
                            </div>

                            <!-- Main Box Body -->
                            <div class="gift-body">
                                <div class="body-front"></div>
                                <div class="body-ribbon-v"></div>
                                <div class="body-ribbon-h"></div>
                                <div class="inner-glow"></div>
                            </div>

                            <!-- Shadow -->
                            <div class="box-shadow"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Revealed Surprise Card Modal / Drawer (Emerges smoothly from gift box) -->
        <div class="surprise-card-container" id="surprise-card-container">
            <div class="surprise-card" id="surprise-card">
                <button class="card-close-x" id="close-card-btn" aria-label="Close card">&times;</button>
                <div class="card-border-light"></div>

                <div class="card-rakhi-badge">
                    <span class="gift-emoji">🎁</span>
                </div>

                <h2 class="card-headline">Surprise Revealed! 🎉</h2>
                <p class="card-submessage">Wishing you endless happiness, laughter, and cherished moments on this Raksha Bandhan.</p>

                <!-- Featured URL Card -->
                <div class="url-destination-box">
                    <span class="url-badge-label">Your Exclusive Destination</span>
                    <div class="url-display-text" id="target-url">www.theprettyarts.com</div>
                    
                    <div class="action-buttons-group">
                        <a href="https://www.theprettyarts.com" target="_blank" rel="noopener noreferrer" class="btn btn-teal-solid">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                            Visit Website
                        </a>
                        <button class="btn btn-gold-outline" id="copy-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            <span id="copy-text">Copy Link</span>
                        </button>
                    </div>
                </div>

                <button class="btn-wrap-again" id="replay-btn">
                    <span>🔄 Re-wrap & Play Again</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
